spring.application.name=football-talent-network
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/football_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=roots
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
server.port=8080
server.servlet.context-path=/

# JWT Configuration - Change this in production
jwt.secret=your_super_secret_jwt_key_minimum_32_characters_long_for_security
jwt.expiration=86400000
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

openai.api.key=${OPENAI_API_KEY:}
$env:OPENAI_API_KEY="your-new-key-here"